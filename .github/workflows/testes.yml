name: Obras-exemplo
on:
  push:
    paths: ["regras.js", "testes/**"]
  pull_request:
    paths: ["regras.js", "testes/**"]
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node testes/obras-exemplo.test.js
